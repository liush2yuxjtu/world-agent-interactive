<style>

*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:3px solid rgba(49,87,255,.25);outline-offset:3px}.wrap{max-width:1280px;margin:0 auto;padding:28px 22px 44px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}.eyebrow{font-size:13px;font-weight:850;letter-spacing:.12em;color:var(--blue);text-transform:uppercase}h1{font-size:clamp(30px,4vw,52px);line-height:1.04;margin:8px 0 5px;letter-spacing:-.04em}.sub{color:var(--muted);font-size:16px;margin:0}.demo-badge{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:10px 14px;color:var(--muted);font-size:13px;white-space:nowrap}.shell{display:grid;grid-template-columns:minmax(0,1.03fr) minmax(360px,.97fr);border:1px solid var(--line);background:var(--paper);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;min-height:720px}.chat{display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0}.chat-head,.world-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.eve-dot{width:34px;height:34px;border-radius:12px;background:var(--blue);display:grid;place-items:center;color:#fff;font-weight:950}.live{display:flex;align-items:center;gap:7px;color:var(--green);font-size:12px;font-weight:800}.live i{width:8px;height:8px;border-radius:50%;background:var(--green);display:block}.messages{padding:22px;display:flex;flex-direction:column;gap:15px;overflow:auto;flex:1;background:#fbfcfe}.msg{max-width:86%;display:flex;gap:9px;align-items:flex-start;animation:rise .25s ease-out}.msg.user{margin-left:auto;flex-direction:row-reverse}.avatar{flex:0 0 auto;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:900}.user .avatar{background:#111827;color:#fff}.eve .avatar{background:var(--blue-soft);color:var(--blue)}.bubble{border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.55;box-shadow:0 5px 18px rgba(16,24,40,.04)}.user .bubble{background:#111827;color:#fff;border-color:#111827}.approval{margin:1px 39px 0;border:1px solid #cfd7ff;background:var(--blue-soft);border-radius:17px;padding:15px}.approval small{display:block;color:var(--blue);font-weight:850;margin-bottom:10px}.scenarios{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}.scenario{background:#fff;border:1px solid #d8defd;border-radius:13px;padding:10px}.scenario b{font-size:24px;display:block;line-height:1}.scenario span{font-size:11px;color:var(--muted)}.actions{display:flex;gap:9px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:850;cursor:pointer;transition:.2s transform,.2s opacity,.2s background}.btn:active{transform:translateY(1px)}.btn.primary{background:var(--blue);color:#fff;flex:1}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn[disabled]{opacity:.55;cursor:default}.quick{padding:14px 20px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:#fff}.quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;color:var(--muted);cursor:pointer;font-size:12px}.world{display:flex;flex-direction:column;background:#f8faff;min-width:0}.world-head b{font-size:14px}.tooltrace{font-size:11px;color:var(--muted)}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:15px 18px 6px}.flow-step{display:grid;justify-items:center;gap:6px;color:#98a2b3;font-size:11px;font-weight:800;text-align:center}.flow-step i{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid #d0d5dd;display:grid;place-items:center;font-style:normal}.flow-step.active{color:var(--blue)}.flow-step.active i{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}.flow-step.done{color:var(--green)}.flow-step.done i{border-color:var(--green);background:var(--green-soft);color:var(--green)}.stage{padding:12px 18px 18px;display:grid;gap:12px;flex:1}.world-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(16,24,40,.04)}.world-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:11px}.world-title h2{font-size:18px;margin:0}.pill{font-size:11px;font-weight:850;color:var(--amber);background:var(--amber-soft);padding:6px 9px;border-radius:999px}.arena{position:relative;min-height:260px;border-radius:18px;background:radial-gradient(circle at 30% 35%,rgba(49,87,255,.12),transparent 30%),radial-gradient(circle at 70% 62%,rgba(22,131,93,.10),transparent 26%),#f7f9ff;border:1px solid #e5e9ff;overflow:hidden}.choice{position:absolute;top:18px;width:112px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:11px;text-align:center;z-index:2}.choice.a{left:18px}.choice.b{right:18px}.choice b{font-size:28px;display:block}.choice span{font-size:11px;color:var(--muted)}.people{position:absolute;inset:0}.person{position:absolute;width:15px;height:15px;border-radius:50%;background:#aeb8d8;border:2px solid #fff;box-shadow:0 2px 6px rgba(16,24,40,.14);transition:1s transform,1s background}.running .person:nth-child(odd){background:#6578ff}.running .person:nth-child(even){background:#6fc7a2}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.metric small{display:block;color:var(--muted);font-size:11px}.metric b{font-size:22px;display:block;margin-top:3px}.compare{display:grid;gap:9px;margin-top:12px}.barline{display:grid;grid-template-columns:46px 1fr 58px;gap:8px;align-items:center;font-size:12px;font-weight:750}.track{height:10px;background:#eef1f5;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;border-radius:999px;background:var(--blue);transition:900ms width ease}.fill.green{background:var(--green)}.note{display:flex;gap:10px;align-items:flex-start;border:1px solid #f0d7a6;background:#fffaf0;border-radius:14px;padding:11px;color:#754b12;font-size:12px;line-height:1.45}.note b{color:#5e3b0d}.recap{margin-top:18px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:16px 18px;display:grid;grid-template-columns:repeat(9,auto);justify-content:space-between;gap:10px;align-items:center}.recap-step{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--muted)}.recap-step i{width:24px;height:24px;border-radius:8px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-style:normal}.arrow{color:#b1b8c6;text-align:center}.hidden{display:none!important}.muted{color:var(--muted)}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(49,87,255,0)}50%{box-shadow:0 0 0 10px rgba(49,87,255,.08)}}.running .choice{animation:pulse 1.1s infinite}@media(max-width:860px){.top{align-items:flex-start;flex-direction:column}.demo-badge{white-space:normal}.shell{grid-template-columns:1fr;min-height:auto}.chat{border-right:0;border-bottom:1px solid var(--line)}.messages{min-height:480px;max-height:none}.arena{min-height:290px}.recap{grid-template-columns:1fr}.arrow{display:none}}@media(max-width:520px){.wrap{padding:18px 12px 30px}.shell{border-radius:20px}.messages{padding:15px}.approval{margin:0 5px}.flow{gap:2px;padding-inline:10px}.flow-step{font-size:10px}.scenario b{font-size:21px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap"><header class="top"><div><div class="eyebrow">Eve × Business World Model</div><h1>聊天，就像在“委托一个实验”</h1><p class="sub">Eve 负责设计、请示、运行、解释；世界模型负责发生。</p></div><div class="demo-badge">交互概念 Demo · 示例数字不是现实预测</div></header>
<main class="shell" aria-label="Eve 与 Business World Model 的交互演示"><section class="chat" aria-label="Eve 对话"><div class="chat-head"><div class="brand"><span class="eve-dot">E</span><span>Eve</span></div><span class="live"><i></i>实验操作员</span></div><div class="messages" id="messages" aria-live="polite"><div class="msg user"><div class="avatar">你</div><div class="bubble">白桃气泡水，¥6 还是 ¥8 更好？</div></div><div class="msg eve"><div class="avatar">E</div><div class="bubble">我先只改变价格。100 人 · 14 天 · 2 轮。你批准后我才运行。</div></div><div class="approval" id="approval"><small>待批准实验</small><div class="scenarios"><div class="scenario"><b>¥6</b><span>其他条件相同</span></div><div class="scenario"><b>¥8</b><span>其他条件相同</span></div></div><div class="actions"><button class="btn primary" id="approve">批准并运行</button><button class="btn ghost" id="reset">重置</button></div></div></div><div class="quick"><button data-q="why">为什么要先审批？</button><button data-q="next">还能继续追问吗？</button><button data-q="truth">这等于真实市场预测吗？</button></div></section>
<section class="world" aria-label="Business World Model 运行状态"><div class="world-head"><b>实验世界</b><span class="tooltrace" id="tooltrace">等待批准</span></div><div class="flow" aria-label="Eve 实验流程"><div class="flow-step done" data-step="0"><i>1</i><span>理解</span></div><div class="flow-step done" data-step="1"><i>2</i><span>设计</span></div><div class="flow-step active" data-step="2"><i>3</i><span>批准</span></div><div class="flow-step" data-step="3"><i>4</i><span>运行</span></div><div class="flow-step" data-step="4"><i>5</i><span>检查</span></div></div><div class="stage"><div class="world-card"><div class="world-title"><h2>同一个世界，只改一个变量</h2><span class="pill">价格测试</span></div><div class="arena" id="arena" aria-label="两种价格方案在同一批合成消费者中运行的示意图"><div class="choice a"><span>方案 A</span><b>¥6</b></div><div class="choice b"><span>方案 B</span><b>¥8</b></div><div class="people" id="people" aria-hidden="true"></div></div></div><div class="world-card hidden" id="results" aria-live="polite"></div></div></section></main>
<section class="recap" aria-label="Eve 工作方式总结"><div class="recap-step"><i>1</i>你说目标</div><div class="arrow">→</div><div class="recap-step"><i>2</i>Eve 设计实验</div><div class="arrow">→</div><div class="recap-step"><i>3</i>你批准</div><div class="arrow">→</div><div class="recap-step"><i>4</i>世界运行</div><div class="arrow">→</div><div class="recap-step"><i>5</i>Eve 解释</div></section></div>
<script>
(function(){const messages=document.getElementById('messages');const approval=document.getElementById('approval');const approve=document.getElementById('approve');const reset=document.getElementById('reset');const results=document.getElementById('results');const arena=document.getElementById('arena');const trace=document.getElementById('tooltrace');const steps=[...document.querySelectorAll('.flow-step')];const people=document.getElementById('people');const pts=[[32,50],[40,61],[47,43],[54,56],[62,47],[70,58],[78,42],[25,68],[35,75],[46,71],[57,76],[67,69],[76,78],[19,55],[84,60],[28,36],[39,31],[61,32],[73,27],[52,66]];pts.forEach((p,i)=>{const d=document.createElement('i');d.className='person';d.style.left=p[0]+'%';d.style.top=p[1]+'%';d.style.transform='translate(-50%,-50%) scale('+(0.85+(i%4)*0.08)+')';people.appendChild(d)});function addMsg(who,text){const row=document.createElement('div');row.className='msg '+(who==='user'?'user':'eve');const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=who==='user'?'你':'E';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;row.appendChild(avatar);row.appendChild(bubble);messages.appendChild(row);messages.scrollTop=messages.scrollHeight}function mark(index,state){steps[index].classList.remove('active','done');if(state)steps[index].classList.add(state)}function resetFlow(){steps.forEach((s,i)=>{s.classList.remove('active','done');if(i<2)s.classList.add('done')});steps[2].classList.add('active');arena.classList.remove('running');results.classList.add('hidden');results.innerHTML='';trace.textContent='等待批准';approve.disabled=false;approve.textContent='批准并运行';approval.classList.remove('hidden')}
approve.addEventListener('click',()=>{approve.disabled=true;approve.textContent='已批准';mark(2,'done');mark(3,'active');addMsg('user','批准。');addMsg('eve','收到。我现在运行实验，随后检查结果是否值得相信。');trace.textContent='run_experiment';arena.classList.add('running');setTimeout(()=>{trace.textContent='get_run'},900);setTimeout(()=>{mark(3,'done');mark(4,'active');trace.textContent='check_reliability';results.innerHTML=`<div class="world-title"><h2>示例结果</h2><span class="pill">仅演示界面</span></div><div class="result-grid"><div class="metric"><small>¥6 · 转化</small><b>14.8%</b></div><div class="metric"><small>¥8 · 转化</small><b>12.1%</b></div></div><div class="compare"><div class="barline"><span>¥6</span><div class="track"><div class="fill" id="barA"></div></div><b>12.4k</b></div><div class="barline"><span>¥8</span><div class="track"><div class="fill green" id="barB"></div></div><b>15.3k</b></div></div><div class="note"><span>◌</span><span><b>可靠性提醒：</b>模型内比较可参考；现实销量仍需真实数据校准。</span></div>`;results.classList.remove('hidden');requestAnimationFrame(()=>{document.getElementById('barA').style.width='69%';document.getElementById('barB').style.width='85%'})},1800);setTimeout(()=>{mark(4,'done');trace.textContent='实验完成';addMsg('eve','示例里 ¥8 的模型内净贡献更高，但转化更低。我会建议先做真实 A/B 校准，而不是直接当成市场预测。');approval.classList.add('hidden')},2700)});reset.addEventListener('click',()=>{const extra=[...messages.querySelectorAll('.msg')].slice(2);extra.forEach(x=>x.remove());resetFlow()});document.querySelectorAll('.quick button').forEach(btn=>{btn.addEventListener('click',()=>{const key=btn.dataset.q;const pairs={why:['为什么要先审批？','因为 Eve 可以规划，但真正运行实验属于“行动”。先让你看清假设，再由你授权。'],next:['还能继续追问吗？','可以。你可以继续问“为什么”“换渠道呢”“只看年轻人呢”，Eve 会基于当前实验继续工作。'],truth:['这等于真实市场预测吗？','不等于。现在是未校准机制模型；它适合比较方案和发现问题，现实预测要用真实数据验证。']};addMsg('user',pairs[key][0]);addMsg('eve',pairs[key][1])})})})();
</script>
</body>
