<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fc">
  <meta name="description" content="World Agent 可点击市场仿真实验工作台。">
  <title>实验中心 · World Agent</title>
  <link rel="icon" href="../design-system/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../src/tokens.css">
  <link rel="stylesheet" href="../src/components.css">
  <link rel="stylesheet" href="src/app.css">
  <link rel="stylesheet" href="src/reference-layout.css">
  <link rel="stylesheet" href="../reference-preview/polish.css">
<script type="module" src="../reference-preview/art.mjs"></script>
</head>
<body>
  <a class="app-skip" href="#workspace">跳到实验内容</a>
  <div class="app-shell">
    <aside class="app-sidebar" aria-label="应用导航">
      <a class="app-wordmark" href="../" aria-label="World Agent 官网"><svg viewBox="0 0 48 32"><path d="M4 5 13 27 24 5l10 22L44 5"/></svg><span><strong>World Agent</strong><small>赢销通</small></span></a>
      <nav>
        <button data-nav="home"><i><svg class="reference-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10H15v-7H9v7H3Z"/></svg></i><span>首页</span></button>
        <button data-nav="consumer"><i><svg class="reference-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10H15v-7H9v7H3Z"/></svg></i><span>消费者世界</span></button>
        <button class="is-active" data-nav="lab"><i><svg class="reference-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5M16 11a4 4 0 1 1-8 0 4 4 0 0 1 8 0m-9 7c2-3 8-3 10 0"/></svg></i><span>实验中心</span></button>
        <div class="app-subnav"><button data-nav="templates">实验模板</button><button data-nav="mine">我的实验</button></div>
        <button data-nav="market"><i><svg class="reference-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 9 5v10l-9 5-9-5V7Zm0 10 9-5M12 12v10M3 7l9 5M7 4l10 6v7"/></svg></i><span>市场洞察</span></button>
        <button data-nav="data"><i><svg class="reference-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3v18h17M8 15l4-5 4 2 5-7"/></svg></i><span>数据中心</span></button>
        <button data-nav="reports"><i><svg class="reference-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6Zm8 0v5h5M9 12h7M9 16h7"/></svg></i><span>报告</span></button>
        <button data-nav="settings"><i><svg class="reference-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 2 3 3-.3.5 3 3 1-1 3 1 3-3 1-.5 3-3-.3-2 3-2-3-3 .3-.5-3-3-1 1-3-1-3 3-1 .5-3 3 .3ZM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/></svg></i><span>设置</span></button>
      </nav>
      <a class="app-design-link" href="../assistant/"><i>E</i><span>Eve 决策助手</span></a>
      <a class="app-design-link" href="../design-system/"><i>✦</i><span>Design System</span></a>
    </aside>

    <div class="app-stage">
      <header class="app-topbar"><button class="app-nav-toggle" data-action="toggle-nav" aria-label="打开导航">☰</button><label class="app-search"><span><svg class="reference-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m20 20-5-5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0"/></svg></span><input type="search" placeholder="搜索实验、消费者、行业…" aria-label="搜索实验"></label><div class="app-top-actions"><button aria-label="通知"><svg class="reference-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button><span class="app-avatar photo-avatar" role="img" aria-label="示例用户头像"></span><span><strong>张三</strong><small>品牌经理</small></span><button aria-label="账号菜单">⌄</button></div></header>
      <main id="workspace" tabindex="-1"></main>
    </div>
  </div>
  <dialog class="app-dialog" id="run-dialog"><button class="app-dialog-close" data-action="close-dialog" aria-label="关闭">×</button><div id="run-dialog-body"></div></dialog>
  <div class="app-toast" role="status" aria-live="polite"></div>
  <script type="module" src="src/app.mjs"></script>
</body>
</html>
