<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fc">
  <meta name="description" content="World Agent 可点击市场仿真实验工作台。">
  <title>实验中心 · World Agent</title>
  <link rel="icon" href="../design-system/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../src/tokens.css">
  <link rel="stylesheet" href="../src/components.css">
  <link rel="stylesheet" href="src/app.css">
</head>
<body>
  <a class="app-skip" href="#workspace">跳到实验内容</a>
  <div class="app-shell">
    <aside class="app-sidebar" aria-label="应用导航">
      <a class="app-wordmark" href="../" aria-label="World Agent 官网"><svg viewBox="0 0 48 32"><path d="M4 5 13 27 24 5l10 22L44 5"/></svg><span><strong>World Agent</strong><small>赢销通</small></span></a>
      <nav>
        <button data-nav="home"><i>⌂</i><span>首页</span></button>
        <button data-nav="consumer"><i>◎</i><span>消费者世界</span></button>
        <button class="is-active" data-nav="lab"><i>▣</i><span>实验中心</span></button>
        <div class="app-subnav"><button data-nav="templates">实验模板</button><button data-nav="mine">我的实验</button></div>
        <button data-nav="market"><i>◇</i><span>市场洞察</span></button>
        <button data-nav="data"><i>▤</i><span>数据中心</span></button>
        <button data-nav="reports"><i>▥</i><span>报告</span></button>
        <button data-nav="settings"><i>⚙</i><span>设置</span></button>
      </nav>
      <a class="app-design-link" href="../design-system/"><i>✦</i><span>Design System</span></a>
    </aside>

    <div class="app-stage">
      <header class="app-topbar"><button class="app-nav-toggle" data-action="toggle-nav" aria-label="打开导航">☰</button><label class="app-search"><span>⌕</span><input type="search" placeholder="搜索实验、消费者、行业…" aria-label="搜索实验"></label><div class="app-top-actions"><button aria-label="通知">♧</button><span class="app-avatar">张</span><span><strong>张三</strong><small>品牌经理</small></span><button aria-label="账号菜单">⌄</button></div></header>
      <main id="workspace" tabindex="-1"></main>
    </div>
  </div>
  <dialog class="app-dialog" id="run-dialog"><button class="app-dialog-close" data-action="close-dialog" aria-label="关闭">×</button><div id="run-dialog-body"></div></dialog>
  <div class="app-toast" role="status" aria-live="polite"></div>
  <script type="module" src="src/app.mjs"></script>
</body>
</html>
