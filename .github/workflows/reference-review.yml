name: Reference review
on:
  push:
    branches: [fix/reference-alignment-v2]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply checksum-verified source updates
        run: python scripts/apply_reference_v2.py
      - name: Build and unit tests
        run: npm run check
      - name: Browser and image comparison dependencies
        run: |
          python -m pip install playwright pillow opencv-python-headless scikit-image
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture real HTTP snapshots and OpenCV differences
        run: python scripts/reference_review.py
      - name: Commit reviewed source and visual evidence on review branch only
        if: github.ref == 'refs/heads/fix/reference-alignment-v2'
        run: |
          git config user.name 'World Agent visual QA'
          git config user.email '104006363+liush2yuxjtu@users.noreply.github.com'
          git add index.html app/index.html app/src/app.mjs scripts/build.mjs
          git add -f docs/qa/reference-v2/
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ui): apply verified reference layout and browser evidence'
            git push origin HEAD:fix/reference-alignment-v2
          fi
      - name: Upload reproducible source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-review-source
          path: |
            .
            !.git/**
            !dist/**
          include-hidden-files: true
          retention-days: 7
      - name: Upload screenshots and differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-review-evidence
          path: docs/qa/reference-v2/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload static review site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reference-review-site
          path: dist/
          include-hidden-files: true
          retention-days: 14
