name: Project Integrity
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Python browser test dependencies
        run: |
          python -m pip install playwright==1.63.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - run: npm run check
      - name: Validate build output
        run: test -f dist/index.html && test -f dist/assistant/index.html
      - name: Validate intent snapshots
        run: node --test tests/intent-parity.test.mjs tests/eve-chat-intent.test.mjs
      - name: Validate HTML (legacy baseline report)
        continue-on-error: true
        run: npx --yes html-validate "dist/**/*.html"
      - run: npm run test:browser

  eve-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eve-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Eve app dependencies
        run: npm install
      - name: Typecheck Eve app
        run: npm run typecheck
      - name: Build Eve app
        run: npm run build
      - name: Pack validated preview source
        working-directory: .
        run: git archive --format=zip --output=eve-app-preview.zip HEAD eve-app
      - uses: actions/upload-artifact@v4
        with:
          name: china-eve-preview-source
          path: eve-app-preview.zip
          retention-days: 7
